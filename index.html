<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartz Band</title>

  <!-- Tipografías: Bebas Neue (títulos) y Montserrat (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-inicio">

  <!-- ===== CARRUSEL (fondo a pantalla completa) ===== -->
  <div class="carrusel" id="carrusel">
    <img src="img/carrusel/carrusel1.jpg" alt="Heartz Band tocando en el escenario de Charro Negro" class="activa">
    <img src="img/carrusel/carrusel2.jpg" alt="Heartz Band tocando en Calle 47 Bazar">
    <img src="img/carrusel/carrusel3.jpg" alt="Integrantes de Heartz Band posando de noche">
    <img src="img/carrusel/carrusel4.jpg" alt="Heartz Band después de tocar en un cumpleaños" class="encuadre-arriba">
    <img src="img/carrusel/carrusel5.jpg" alt="Heartz Band reunida en Charro Negro">

    <button class="flecha izquierda" id="anterior" aria-label="Foto anterior">&#8249;</button>
    <button class="flecha derecha" id="siguiente" aria-label="Foto siguiente">&#8250;</button>
  </div>

  <!-- ===== PORTADA (logo + BAND) ===== -->
  <header class="portada">
    <h1>
      <img src="img/logo-blanco.png" alt="Heartz" class="logo">
      <span class="band">
        <span>B</span><span>A</span><span>N</span><span>D</span>
      </span>
    </h1>
  </header>

  <!-- ===== INSTAGRAM (abajo al centro) ===== -->
  <a class="redes" href="https://www.instagram.com/heartztheband/" target="_blank" rel="noopener noreferrer"
     aria-label="Instagram de Heartz Band (se abre en una pestaña nueva)">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/>
    </svg>
    <span>@heartztheband</span>
  </a>

  <!-- ===== BOTÓN HAMBURGUESA (arriba a la derecha) ===== -->
  <button class="hamburguesa" id="abrir-menu" aria-label="Abrir menú" aria-controls="menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <!-- ===== MENÚ DESPLEGABLE ===== -->
  <nav class="menu" id="menu" aria-hidden="true">
    <div class="menu-opciones">
      <a href="#" data-img="img/menu/biografia.jpg" class="deshabilitada" aria-disabled="true">Biografía</a>
      <a href="galeria.html" data-img="img/menu/galeria.jpg">Galería</a>
      <a href="#" data-img="img/menu/contacto.jpg" class="deshabilitada" aria-disabled="true">Contacto</a>
    </div>

    <div class="menu-imagen">
      <img src="img/menu/galeria.jpg" alt="" id="menu-img">
    </div>

    <button class="cerrar" id="cerrar-menu" aria-label="Cerrar menú">&times;</button>
  </nav>

  <script src="js/menu.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
